{% extends 'base.html' %}{% block title %}Novo projeto{% endblock %}{% block content %}<section class="form-layout"><div class="form-intro"><span class="eyebrow">COMPARTILHE SUA IDEIA</span><h1>Todo grande projeto começa com uma proposta.</h1><p>Conte aos alunos o que você quer construir e como eles podem participar.</p></div><form class="form-card" method="post" action="{{ url_for('professor.create_project') }}"><h2>Novo projeto</h2><label>Título do projeto<input name="title" required maxlength="160" placeholder="Ex.: Horta inteligente no campus"></label><label>Descrição<textarea name="description" required rows="6" placeholder="Apresente o tema, os objetivos e o que será desenvolvido."></textarea></label><label>Requisitos ou perfil desejado <span class="optional">opcional</span><textarea name="requirements" rows="4" placeholder="Conhecimentos, disponibilidade ou curso de interesse."></textarea></label><div class="form-actions"><a class="text-link" href="{{ url_for('main.dashboard') }}">Cancelar</a><button class="button button-primary">Publicar projeto <span>→</span></button></div></form></section>{% endblock %}
