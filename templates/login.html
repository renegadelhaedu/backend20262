{% extends 'base.html' %}

{% block title %}Entrar{% endblock %}

{% block content %}
  <section class="form-layout">
    <div class="form-intro">
      <span class="eyebrow">BEM-VINDO DE VOLTA</span>
      <h1>Suas próximas ideias começam aqui.</h1>
      <p>Acesse sua conta para acompanhar projetos e oportunidades.</p>
    </div>

    <form class="form-card" method="post" action="{{ url_for('auth.login') }}">
      <h2>Entrar na plataforma</h2>
      <label>
        E-mail
        <input type="email" name="email" required autocomplete="email">
      </label>
      <label>
        Senha
        <input type="password" name="password" required autocomplete="current-password">
      </label>
      <button class="button button-primary full">Entrar <span>→</span></button>
      <p class="form-foot">
        Ainda não tem conta?
        <a href="{{ url_for('auth.register', role='student') }}">Cadastre-se</a>
      </p>
    </form>
  </section>
{% endblock %}
